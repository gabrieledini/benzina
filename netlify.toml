[build]
  publish = "."

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# La funzione /api/prezzi è la via principale: scarica e filtra lato server.
# Questo redirect resta come rete di sicurezza per leggere i CSV grezzi.
[[redirects]]
  from = "/mimit/*"
  to = "https://www.mimit.gov.it/images/exportCSV/:splat"
  status = 200
  force = true
